services:
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    environment:
      NODE_ENV: production
      APP_RELEASE: "${SOURCE_COMMIT:-unknown}"

      DATABASE_URL: "${DATABASE_URL:?Set DATABASE_URL to the Coolify PostgreSQL internal URL}"
      DATABASE_SSL: "${DATABASE_SSL:-false}"
      DATABASE_SSL_REJECT_UNAUTHORIZED: "${DATABASE_SSL_REJECT_UNAUTHORIZED:-true}"
      DATABASE_POOL_MAX: "${DATABASE_POOL_MAX:-10}"

      LLM_PROVIDER: "${LLM_PROVIDER:?Set LLM_PROVIDER in Coolify}"
      LLM_MODEL: "${LLM_MODEL:?Set LLM_MODEL in Coolify}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      OPENROUTER_API_KEY: "${OPENROUTER_API_KEY:-}"
      TOGETHER_API_KEY: "${TOGETHER_API_KEY:-}"
      NOUS_API_KEY: "${NOUS_API_KEY:-}"
      HF_API_KEY: "${HF_API_KEY:-}"
      DEEPSEEK_API_KEY: "${DEEPSEEK_API_KEY:-}"
      GROQ_API_KEY: "${GROQ_API_KEY:-}"
      OLLAMA_API_KEY: "${OLLAMA_API_KEY:-}"
      ZAI_API_KEY: "${ZAI_API_KEY:-}"
      KIMI_API_KEY: "${KIMI_API_KEY:-}"
      KIMI_CODING_API_KEY: "${KIMI_CODING_API_KEY:-}"
      SURPLUS_API_KEY: "${SURPLUS_API_KEY:-}"

      OPENROUTER_BASE_URL: "${OPENROUTER_BASE_URL:-}"
      TOGETHER_BASE_URL: "${TOGETHER_BASE_URL:-}"
      NOUS_BASE_URL: "${NOUS_BASE_URL:-}"
      HF_BASE_URL: "${HF_BASE_URL:-}"
      OPENAI_BASE_URL: "${OPENAI_BASE_URL:-}"
      ANTHROPIC_BASE_URL: "${ANTHROPIC_BASE_URL:-}"
      DEEPSEEK_BASE_URL: "${DEEPSEEK_BASE_URL:-}"
      GROQ_BASE_URL: "${GROQ_BASE_URL:-}"
      OLLAMA_BASE_URL: "${OLLAMA_BASE_URL:-}"
      ZAI_BASE_URL: "${ZAI_BASE_URL:-}"
      KIMI_BASE_URL: "${KIMI_BASE_URL:-}"
      SURPLUS_BASE_URL: "${SURPLUS_BASE_URL:-}"
      OPENROUTER_REFERER: "${OPENROUTER_REFERER:-}"
      OPENROUTER_APP_NAME: "${OPENROUTER_APP_NAME:-CRM DeepAgent}"

      CRM_API_KEY: "${CRM_API_KEY:-}"
      CRM_USERNAME: "${CRM_USERNAME:-}"
      CRM_PASSWORD: "${CRM_PASSWORD:-}"
      CRM_BEARER_TOKEN: "${CRM_BEARER_TOKEN:-}"
      CRM_BASE_URL: "${CRM_BASE_URL:-https://crmapi.casafaricrm.com}"
      CRM_TIMEOUT_MS: "${CRM_TIMEOUT_MS:-30000}"
      CRM_USER_AGENT: "${CRM_USER_AGENT:-crm-deepagent/0.1.0}"

      # Workflow semantics and external integrations: docs/agent-workflows-setup.md
      RAPIDAPI_KEY: "${RAPIDAPI_KEY:-}"
      CRM_TIMEZONE: "${CRM_TIMEZONE:-}"
      CRM_FIRST_RESPONSE_HOURS: "${CRM_FIRST_RESPONSE_HOURS:-24}"
      CRM_INACTIVITY_HOURS: "${CRM_INACTIVITY_HOURS:-168}"
      CRM_EVENT_HISTORY_COMPLETE: "${CRM_EVENT_HISTORY_COMPLETE:-false}"
      CRM_COMPLETED_CONTACT_EVENT_TYPE_IDS_JSON: "${CRM_COMPLETED_CONTACT_EVENT_TYPE_IDS_JSON:-}"
      CRM_COMPLETED_CONTACT_EVENT_TYPES_JSON: "${CRM_COMPLETED_CONTACT_EVENT_TYPES_JSON:-}"
      CRM_CLOSED_OUTCOMES_JSON: "${CRM_CLOSED_OUTCOMES_JSON:-}"
      CRM_WON_OUTCOMES_JSON: "${CRM_WON_OUTCOMES_JSON:-}"
      CRM_BUSINESS_HOURS_JSON: "${CRM_BUSINESS_HOURS_JSON:-}"
      CRM_PROPERTY_ACTIVE_STATUSES_JSON: "${CRM_PROPERTY_ACTIVE_STATUSES_JSON:-}"
      CRM_LEAD_INSERT_VALIDATED: "${CRM_LEAD_INSERT_VALIDATED:-false}"
      CRM_LEAD_STATUS_ID: "${CRM_LEAD_STATUS_ID:-}"
      CRM_LEAD_ORIGIN_IDS: "${CRM_LEAD_ORIGIN_IDS:-}"
      CRM_LISTING_URLS_PATH: "${CRM_LISTING_URLS_PATH:-}"
      CRM_LISTING_SOURCE_URL: "${CRM_LISTING_SOURCE_URL:-}"
      CRM_LISTING_ALLOWED_HOSTS: "${CRM_LISTING_ALLOWED_HOSTS:-}"
      CRM_LISTING_SYNC_MAX_PAGES: "${CRM_LISTING_SYNC_MAX_PAGES:-1000}"
      BONTE_NDA_CONFIG_PATH: "${BONTE_NDA_CONFIG_PATH:-}"
      BONTE_CMI_CONFIG_PATH: "${BONTE_CMI_CONFIG_PATH:-}"
      BONTE_ATTACHMENT_RETENTION_DAYS: "${BONTE_ATTACHMENT_RETENTION_DAYS:-30}"
      BONTE_S3_BUCKET: "${BONTE_S3_BUCKET:-}"
      BONTE_S3_REGION: "${BONTE_S3_REGION:-${AWS_REGION:-}}"
      BONTE_S3_ENDPOINT: "${BONTE_S3_ENDPOINT:-}"
      AWS_REGION: "${AWS_REGION:-}"
      AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID:-}"
      AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY:-}"
      AWS_EC2_METADATA_DISABLED: "${AWS_EC2_METADATA_DISABLED:-}"
      BONTE_OCR_LANGUAGES: "${BONTE_OCR_LANGUAGES:-eng+por}"
      GOOGLE_CALENDAR_CLIENT_ID: "${GOOGLE_CALENDAR_CLIENT_ID:-}"
      GOOGLE_CALENDAR_CLIENT_SECRET: "${GOOGLE_CALENDAR_CLIENT_SECRET:-}"
      GOOGLE_CALENDAR_REFRESH_TOKEN: "${GOOGLE_CALENDAR_REFRESH_TOKEN:-}"
      GOOGLE_CALENDAR_ALLOWED_IDS: "${GOOGLE_CALENDAR_ALLOWED_IDS:-}"
      GOOGLE_CALENDAR_WORKSPACE_ID: "${GOOGLE_CALENDAR_WORKSPACE_ID:-}"
      GOOGLE_CALENDAR_WORKSPACE_IDS: "${GOOGLE_CALENDAR_WORKSPACE_IDS:-}"
      GOOGLE_CALENDAR_AUTHORIZED_ACTOR_IDS: "${GOOGLE_CALENDAR_AUTHORIZED_ACTOR_IDS:-}"

      TELEGRAM_BOT_TOKEN: "${TELEGRAM_BOT_TOKEN:-}"
      TELEGRAM_ALLOWED_USERS: "${TELEGRAM_ALLOWED_USERS:-}"
      TELEGRAM_REQUIRE_MENTION: "${TELEGRAM_REQUIRE_MENTION:-true}"
      TELEGRAM_TYPING_INDICATOR: "${TELEGRAM_TYPING_INDICATOR:-true}"
      TELEGRAM_STREAM_UPDATES: "${TELEGRAM_STREAM_UPDATES:-true}"

      WHATSAPP_ENABLED: "${WHATSAPP_ENABLED:-false}"
      WHATSAPP_AUTH_DIR: /app/.whatsapp-auth
      WHATSAPP_ALLOW_FROM: "${WHATSAPP_ALLOW_FROM:-}"
      WHATSAPP_ALLOW_GROUPS: "${WHATSAPP_ALLOW_GROUPS:-}"
      WHATSAPP_REQUIRE_MENTION: "${WHATSAPP_REQUIRE_MENTION:-true}"
      WHATSAPP_DEBUG: "${WHATSAPP_DEBUG:-false}"
      WHATSAPP_SEND_TIMEOUT_MS: "${WHATSAPP_SEND_TIMEOUT_MS:-60000}"
      WHATSAPP_CHUNK_DELAY_MS: "${WHATSAPP_CHUNK_DELAY_MS:-300}"
      WHATSAPP_MODE: "${WHATSAPP_MODE:-bot}"
      WHATSAPP_REPLY_PREFIX: "${WHATSAPP_REPLY_PREFIX:-}"
      WHATSAPP_FORWARD_OWNER_MESSAGES: "${WHATSAPP_FORWARD_OWNER_MESSAGES:-false}"
      WHATSAPP_HANDOVER_MINUTES: "${WHATSAPP_HANDOVER_MINUTES:-60}"
      WHATSAPP_SEND_READ_RECEIPTS: "${WHATSAPP_SEND_READ_RECEIPTS:-false}"
      WHATSAPP_STREAM_UPDATES: "${WHATSAPP_STREAM_UPDATES:-true}"
      WHATSAPP_MAX_MESSAGE_LENGTH: "${WHATSAPP_MAX_MESSAGE_LENGTH:-4096}"

      SESSION_RESET_MINUTES: "${SESSION_RESET_MINUTES:-0}"
      DEEPAGENT_TOOL_LOGS: "${DEEPAGENT_TOOL_LOGS:-false}"
      WEB_GATEWAY_ENABLED: "true"
      GATEWAY_WEB_HOST: 0.0.0.0
      GATEWAY_WEB_PORT: "8787"
      GATEWAY_WEB_TOKEN: "${GATEWAY_WEB_TOKEN:?Set GATEWAY_WEB_TOKEN in Coolify}"

      PROPERTY_PDF_BRAND_NAME: "${PROPERTY_PDF_BRAND_NAME:-Bonte}"
      PROPERTY_PDF_LOGO_PATH: "${PROPERTY_PDF_LOGO_PATH:-}"
      PROPERTY_PDF_PRIMARY_COLOR: "${PROPERTY_PDF_PRIMARY_COLOR:-#173f38}"
      PROPERTY_PDF_ACCENT_COLOR: "${PROPERTY_PDF_ACCENT_COLOR:-#c7a76c}"
    volumes:
      - whatsapp-auth:/app/.whatsapp-auth
      - agent-output:/app/output
      - workflow-config:/app/config:ro
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8787/health',{headers:{authorization:'Bearer '+process.env.GATEWAY_WEB_TOKEN}}).then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    expose:
      - "8787"

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    restart: unless-stopped
    init: true
    depends_on:
      gateway:
        condition: service_healthy
    environment:
      NODE_ENV: production
      APP_RELEASE: "${SOURCE_COMMIT:-unknown}"
      HOSTNAME: 0.0.0.0
      PORT: "3000"

      DATABASE_URL: "${DATABASE_URL:?Set DATABASE_URL to the Coolify PostgreSQL internal URL}"
      DATABASE_SSL: "${DATABASE_SSL:-false}"
      DATABASE_SSL_REJECT_UNAUTHORIZED: "${DATABASE_SSL_REJECT_UNAUTHORIZED:-true}"
      DATABASE_POOL_MAX: "${DATABASE_POOL_MAX:-10}"

      BETTER_AUTH_SECRET: "${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET in Coolify}"
      BETTER_AUTH_URL: "${BETTER_AUTH_URL:?Set BETTER_AUTH_URL to the public web URL}"

      GATEWAY_WS_URL: ws://gateway:8787/ws
      GATEWAY_WEB_TOKEN: "${GATEWAY_WEB_TOKEN:?Set GATEWAY_WEB_TOKEN in Coolify}"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 15s
    expose:
      - "3000"

volumes:
  whatsapp-auth:
  agent-output:
  workflow-config:
